name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check release metadata
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package version ${version}"
            exit 1
          fi
          case "${version}" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          if [ "${PRERELEASE}" = true ] && [ "${dist_tag}" = latest ]; then
            echo "::error::prerelease needs a prerelease version"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
      - name: Skip published version
        id: exists
        env:
          SPEC: ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}
        run: |
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and verify
        if: steps.exists.outputs.published != 'true'
        run: |
          set -euo pipefail
          npm i -g pnpm@11.23.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          node scripts/smoke-npm.mjs "$RUNNER_TEMP/$tarball"
      - name: Publish with trusted publishing
        if: steps.exists.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
          npm publish --access public --tag "$DIST_TAG"
