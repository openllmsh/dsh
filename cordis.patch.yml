# @openllmsh/dsh — DeepSeek Harness bundle patch.
#
# Layered AFTER @deepseek-ai/dsh-base, which already mounts `llm`,
# `llm-pi-ai` (dormant), `llm-deepseek`, and `agent-default-model`. This patch:
#   1. teaches the in-box pi-ai adapter an `openllm` OpenAI-compatible provider,
#   2. points the default conversation model at it,
#   3. registers the OpenLLM MCP server over stdio.
#
# Install OpenLLM first (README prerequisite) — this bundle does NOT install,
# prompt for, or onboard it. No secrets, and none needed: dsh reaches OpenLLM
# through the daemon's local-first gateway on 127.0.0.1:8787, a loopback surface
# with no auth gate (the daemon fetches signed plans with its OWN ~/.openllm/.env
# credentials and forwards upstream). So dsh holds no API key and no origin;
# `openllmd` just has to be running (the installer starts it).

# 1 + 2 — Router: OpenLLM provider on pi-ai, and the default model.
- id: llm-pi-ai
  config:
    providers:
      openllm:
        displayName: OpenLLM
        api: openai-completions
        # Local daemon gateway — no apiKeyEnv (the loopback surface ignores auth).
        baseURL: http://127.0.0.1:8787/v1
        # pi-ai's openai-completions client still refuses to send a request with
        # neither an apiKey nor an Authorization header ("No API key for provider").
        # The loopback gateway ignores the value, so a dummy bearer satisfies the
        # client-side guard without dsh holding a real key. `Authorization` is not
        # a reserved attribution header, so this passes straight through.
        headers:
          Authorization: Bearer local
        # contextWindow is a uniform 1M across tiers (matches every other
        # OpenLLM integration); maxTokens is the MAX output ceiling across the
        # models each tier fans out to in our catalog (packages/api/catalog):
        # ultra→kimi_code/k3 262144, plus→kimi/alibaba 262144, lite→gemini
        # flash-lite 65536.
        models:
          - { id: ultra, name: "ultra (OpenLLM)", contextWindow: 1000000, maxTokens: 262144 }
          - { id: plus,  name: "plus (OpenLLM)",  contextWindow: 1000000, maxTokens: 262144 }
          - { id: lite,  name: "lite (OpenLLM)",  contextWindow: 1000000, maxTokens: 65536 }

- id: agent-default-model
  config:
    provider: openllm
    model: ultra

# 3 — MCP server (stdio). `command: openllm` resolves ~/.openllm/.env itself.
- insert:
    - id: mcp-openllm
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: openllm
        transport: stdio
        command: openllm
        args: ['mcp']
        env: {}
